<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Math & Algebra Quiz</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161822;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-color: #26293b;
            --hover-bg: #1f2235;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .progress-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            outline: none;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--hover-bg);
            border-color: var(--text-muted);
        }

        .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green);
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--accent-red) !important;
            color: var(--accent-red);
        }

        .disabled {
            pointer-events: none;
        }

        .score-screen {
            text-align: center;
            padding: 20px 0;
        }

        .restart-btn {
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 14px 36px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .restart-btn:hover {
            opacity: 0.9;
        }

        /* Math formatting */
        .math {
            font-family: 'Times New Roman', 'CMU Serif', serif;
            font-style: italic;
        }
        .math-bold {
            font-weight: 700;
        }
        .frac {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
        }
        .frac .num {
            display: block;
            border-bottom: 1px solid var(--text-main);
            padding: 0 4px 2px 4px;
        }
        .frac .den {
            display: block;
            padding: 2px 4px 0 4px;
        }
        .sqrt {
            display: inline-block;
            position: relative;
            padding-left: 6px;
        }
        .sqrt::before {
            content: "√";
            font-size: 1.1em;
            margin-right: 2px;
        }
        .sqrt .radicand {
            border-top: 1px solid var(--text-main);
            padding: 0 4px;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz">
        <div class="progress-bar" id="progress"></div>
        <div class="question-text" id="question"></div>
        <div class="options-container" id="options"></div>
    </div>

    <script>
        // All questions – correct answer is always index 0 (A variant)
        const quizData = [
            { question: "Vektorlar kollinearlik sharti?", variants: ["a<sub>x</sub>/b<sub>x</sub> = a<sub>y</sub>/b<sub>y</sub> = a<sub>z</sub>/b<sub>z</sub>", "(a<sub>x</sub>+a<sub>y</sub>+a<sub>z</sub>)/(b<sub>x</sub>+b<sub>y</sub>+b<sub>z</sub>) = 1", "a<sub>x</sub>b<sub>x</sub> + a<sub>y</sub>b<sub>y</sub> + a<sub>z</sub>b<sub>z</sub> = 1", "a<sub>x</sub>/b<sub>x</sub> + a<sub>y</sub>/b<sub>y</sub> = a<sub>z</sub>/b<sub>z</sub>"] },
            { question: "Bazis vektorlar bo‘yicha qurilgan tetraedr hajmi?", variants: ["V = <sup>1</sup>/<sub>6</sub>", "V = 1", "V = -1", "V = <sup>1</sup>/<sub>2</sub>"] },
            { question: "a{3,4}, b{1,1} berilgan. π<sub>b</sub> a ni toping.", variants: ["7√2/2", "√2/2", "√7", "7/2"] },
            { question: "x = 2a + 3b - c vektorni toping", variants: ["x{-10,13,4}", "x{0,10,4}", "x{10,10,1}", "x{4,8,5}"] },
            { question: "x - y = 0 va x + y = 0 kesishuvchi to‘g‘ri chiziqlar bissektrisalari?", variants: ["x = y = 0", "x = y = -1", "x = y = 1", "x = 0, y = 1"] },
            { question: "Tekisliklar perpendikulyarlik sharti?", variants: ["AA<sub>1</sub> + BB<sub>1</sub> + CC<sub>1</sub> = 0", "A/A<sub>1</sub> = B/B<sub>1</sub> = C/C<sub>1</sub> = 0", "(A+B+C)(A<sub>1</sub>+B<sub>1</sub>+C<sub>1</sub>)=0", "A/A<sub>1</sub>+B/B<sub>1</sub>+C/C<sub>1</sub>=0"] },
            { question: "y = 5x - 6 va y = 5x + 4 to‘g‘ri chiziqlar burchagi?", variants: ["α = 0°", "α = 30°", "α = 45°", "α = 60°"] },
            { question: "y = k<sub>1</sub>x + b<sub>1</sub> va y = k<sub>2</sub>x + b<sub>2</sub> kesishish burchagi tangensi?", variants: ["tgα = (k<sub>2</sub> - k<sub>1</sub>)/(1 + k<sub>1</sub>k<sub>2</sub>)", "tgα = 1 + (k<sub>1</sub>+k<sub>2</sub>)/(1-k<sub>1</sub>k<sub>2</sub>)", "tgα = 1 + (k<sub>1</sub>-k<sub>2</sub>)/(1-k<sub>1</sub>k<sub>2</sub>)", "tgα = 1 + (k<sub>1</sub>+k<sub>2</sub>)/(1+k<sub>1</sub>k<sub>2</sub>)"] },
            { question: "AB kesma o‘rtasi radius-vektori?", variants: ["(r<sub>A</sub> + r<sub>B</sub>)/2", "(r<sub>B</sub> - r<sub>A</sub>)/2", "r<sub>A</sub> + r<sub>B</sub>", "r<sub>A</sub> - r<sub>B</sub>"] },
            { question: "[(2i - 3j + k)(i - 2j - k)] vektor moduli?", variants: ["√35", "-7", "7", "35"] },
            { question: "a{3,4} ga yo‘nalishdosh b{9,12} moduli necha marta katta?", variants: ["3", "2", "4", "5"] },
            { question: "a{4,6}, b{-3,3}, c{4,1} vektorlarni ifodalang:", variants: ["c = ½a - ⅔b", "c = 4a + 4b", "c = a - ⅓b", "c = ¼a - 4/3 b"] },
            { question: "d<sub>1</sub>{2,0} va d<sub>2</sub>{1,-1} vektorlar orasidagi burchak?", variants: ["45°", "60°", "90°", "120°"] },
            { question: "a{1,7} va b{4,3} vektorlar burchagi?", variants: ["α = π/4", "α = 60°", "π/6", "α = 75°"] },
            { question: "Vektor ko‘paytmasi to‘g‘ri?", variants: ["[ab] = { |b<sub>y</sub> a<sub>y</sub>|; |b<sub>z</sub> a<sub>z</sub>|; |b<sub>x</sub> a<sub>x</sub>| }", "[ab] = { b<sub>x</sub>/a<sub>x</sub>; b<sub>y</sub>/a<sub>y</sub>; b<sub>z</sub>/a<sub>z</sub> +1 }", "[ab] = {b<sub>x</sub>/a<sub>x</sub>; b<sub>y</sub>/a<sub>y</sub>; b<sub>z</sub>/a<sub>z</sub>}", "[ab] = {a<sub>x</sub>+b<sub>x</sub>; a<sub>y</sub>+b<sub>y</sub>; a<sub>z</sub>+b<sub>z</sub>}"] },
            { question: "P{5, -√2, 3} vektor bilan k vektor burchagi?", variants: ["Cos = 1/2", "Cos = √3/2", "Cos = π/2", "Cos = -√2/6"] },
            { question: "|MN| vektorning a o‘qdagi proyeksiyasi?", variants: ["|MN|·Cosα", "|MN|·tgα", "|MN|·Ctgα", "|MN|·Sinα"] },
            { question: "Vektorlar kollinearlik sharti?", variants: ["a<sub>x</sub>/b<sub>x</sub> = a<sub>y</sub>/b<sub>y</sub> = a<sub>z</sub>/b<sub>z</sub>", "a<sub>x</sub>/b<sub>x</sub> + a<sub>y</sub>/b<sub>y</sub> + a<sub>z</sub>/b<sub>z</sub> = 1", "a<sub>x</sub>b<sub>x</sub> + a<sub>y</sub>b<sub>y</sub> + a<sub>z</sub>b<sub>z</sub> = 0", "(a<sub>x</sub>+a<sub>y</sub>+a<sub>z</sub>)/(b<sub>x</sub>+b<sub>y</sub>+b<sub>z</sub>) = λ"] },
            { question: "a ning qanday qiymatida a{2,a} va b{a,2} qarama-qarshi?", variants: ["a = -2", "a = -1", "a = 1", "a = 2"] },
            { question: "x + y = 0 qanday chiziq?", variants: ["To‘g‘ri chiziq", "Parabola", "Giperbola", "Ellips"] },
            { question: "Faqat ikkita turli natural bo'luvchilarga ega bo'lgan natural son nima deyiladi?", variants: ["Tub son", "Murakkab son", "Toq son", "Butun son"] },
            { question: "Qachon ko'phad nol ko'phad deyiladi?", variants: ["Barcha koeffisiyentlari nolga teng bo'lsa", "Barcha darajalari nolga teng bo'lsa", "Yuqori hadi nolga teng bo'lsa", "Barcha koeffisiyentlari teng bo'lsa"] },
            { question: "Ochiq va bog'lamli to'plam qanday nomlanadi?", variants: ["Soha", "Egri chiziq", "To'g'ri chiziq", "Jordan chizig'i"] },
            { question: "Bir o'zgaruvchili ko'phadlarni qo'shish qanday xossaga ega?", variants: ["Kommutativ bo'ladi", "Kommutativ bo'lmaydi", "Ba'zan kommutativ bo'ladi", "Agar ko'phadlar teng bo'lsa kommutativ bo'ladi"] },
            { question: "Eng kichik natural son bu?", variants: ["1", "2", "3", "0"] },
            { question: "Eng kichik tub son bu?", variants: ["2", "1", "3", "0"] },
            { question: "Eng kichik toq tub son bu?", variants: ["3", "1", "2", "0"] },
            { question: "Arifmetik progressiyaning dastlabki 6 hadlari 7, a<sub>2</sub>, a<sub>3</sub>, a<sub>4</sub>, a<sub>5</sub> va 22 bo'lsa a<sub>2</sub>+a<sub>3</sub>+a<sub>4</sub>+a<sub>5</sub> ni hisoblang", variants: ["58", "65.5", "60.5", "82.7"] },
            { question: "Balandligi 10 m bo'lgan simyog'ochga shilliqqurt ko'tarilardi. U kunduzi 5 m ko'tariladi, kechasi 4 m pastga tushadi. Necha kundan keyin uchiga chiqadi?", variants: ["6", "5", "4", "3"] },
            { question: "Go'sht qaynatilganda o'z og'irligining 40% ini yo'qotadi. 6 kg pishgan go'sht olish uchun qancha go'sht qaynatish kerak?", variants: ["10 kg", "9 kg", "8 kg", "7 kg"] },
            { question: "√a - √b = 3 va a - b = 24 bo'lsa, √a + √b nimaga teng?", variants: ["8", "4.5", "5.5", "6.7"] },
            { question: "|x + 1| + |x - 3| = 8 tenglama haqida qaysi mulohaza to'g'ri?", variants: ["Ildizlari turli ishorali", "Faqat bitta ildizi bor", "Har ikkala ildiz manfiy", "Har ikkala ildiz musbat"] },
            { question: "ln(x - 1) = x - 3 tenglamaning nechta ildizi bor?", variants: ["2", "1", "3", "Ildizi yo'q"] },
            { question: "√(5 - x²) > x - 1 tengsizlikni qanoatlantiruvchi butun sonlar nechta?", variants: ["4", "5", "3", "1"] },
            { question: "log<sub>1/√2</sub>((4x-1)/(4x+8)) < 0 tengsizlikni yeching.", variants: ["(-∞; -2)", "(1/4; ∞)", "(2; ∞)", "(-2; 1/4)"] },
            { question: "x² - 10x + q = 0 tenglamaning ildizlaridan biri 5 ga teng. Barcha koeffitsientlar yig'indisini toping.", variants: ["16", "15.5", "36.7", "35.7"] },
            { question: "x<sup>lg25</sup> + 25<sup>lgx</sup> = 10 tenglamani yeching.", variants: ["√10", "10", "1", "100"] },
            { question: "594 va 378 ning umumiy bo'luvchilari nechta?", variants: ["8", "9", "7", "6"] },
            { question: "6 ga karrali ikki xonali natural sonlar nechta?", variants: ["15", "13", "11", "12"] },
            { question: "Algebra fanining asoschisi kim?", variants: ["Muhammad al-Xorazmiy", "A.R.Beruniy", "A.N.Forobiy", "Ali Qushchi"] },
            { question: "Algoritm termini qaysi olim nomidan olingan?", variants: ["Al-Xorazmiy", "Al-Farg'oniy", "A.R.Beruniy", "Ali Qushchi"] },
            { question: "An'anaviy o'qitish usullari qaysi javobda to'la ko'rsatilgan?", variants: ["Suhbat, hikoya qilish (ma'ruza), o'quvchilar mustaqil ishini uyushtirish", "Hikoya (ma'ruza)", "Hikoya qilish, o'quvchilar mustaqil ishini uyushtirish", "Suhbat, o'quvchilar mustaqil ishini uyushtirish"] },
            { question: "An'anaviy ta'limning kamchiligini ko'rsating.", variants: ["Talabaning aqliy, ijodiy, kommutativ bilim olishini yetarlicha ta'minlamaydi", "Zamonaviy ta'lim talablariga javob bermaydi", "Ta'lim faqat darslik va o'quv qo'llanmalarga asoslanadi", "Ta'limda o'quvchining maqsadlari inobatga olinmaydi"] },
            { question: "Asosiy ta'lim shaklini ko'rsating?", variants: ["Dars", "Ekskursiya", "To'garak", "Labaratoriya"] },
            { question: "Avvaldan loyihalashtirilgan o'quv-tarbiyaviy jarayonni tizimli ta'minlaydigan texnologik tadbirlar to'plami:", variants: ["Pedagogik texnologiya", "Tarbiya usuli", "Ta'lim texnologiyasi", "Ishontirish uslubi"] },
            { question: "Butun fan bo'yicha yutuqlarni aniqlash va baholash?", variants: ["Yakuniy nazorat", "Joriy nazorat", "Oraliq nazorat", "Tashqi nazorat"] },
            { question: "Dars konspektida qanday maqsadlar ko'rsatiladi?", variants: ["Ta'limiy, tarbiyaviy, rivojlantiruvchi", "Ilmiy, tarbiyaviy", "Ta'limiy, rivojlantiruvchi", "Ta'limiy, ijodiy"] },
            { question: "Davlat ta'lim standarti asosida belgilangan nashr qanday o'quv adabiyoti?", variants: ["Darslik", "O'quv qo'llanma", "Ma'ruzalar kursi", "Ilmiy adabiyot"] },
            { question: "Didaktik tamoyillar deganda nimani tushunasiz?", variants: ["Ta'limda o'quv materialini tanlash va uni o'rganishda asoslaniladigan boshlang'ich asosiy qonun-qoidalar", "Pedagogik texnologiyalarning ta'limda qo'llash qoidalari", "O'qituvchi rioya qiladigan metodik sistema", "Talabalar uchun yo'l-qo'riqlar, kasbiy faoliyat uchun nazariy bilimlar tizimi"] },
            { question: "Matematik xulosa chiqarishning necha turi mavjud?", variants: ["3 ta turi: induktsiya, deduktsiya, analogiya", "Induktsiya, deduktsiya, birlik va umumiy hukm", "Induktsiya, deduktsiya, teorema, aksioma", "To'liq va to'liqmas induktsiya, deduktsiya, matematik induktsiya"] }
        ];

        let currentQuestionIndex = 0;
        let progressEl = document.getElementById('progress');
        let questionEl = document.getElementById('question');
        let optionsContainer = document.getElementById('options');
        const quizContainer = document.getElementById('quiz');

        function loadQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                showScore();
                return;
            }

            const currentQuestion = quizData[currentQuestionIndex];
            progressEl.textContent = `Savol ${currentQuestionIndex + 1} / ${quizData.length}`;
            questionEl.innerHTML = currentQuestion.question;
            optionsContainer.innerHTML = '';

            // Correct answer is always index 0 (A variant)
            const choices = currentQuestion.variants.map((variant, index) => {
                return { text: variant, isCorrect: index === 0 };
            });

            // Shuffle
            for (let i = choices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [choices[i], choices[j]] = [choices[j], choices[i]];
            }

            choices.forEach(choice => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                button.innerHTML = choice.text;
                button.addEventListener('click', () => handleAnswer(button, choice.isCorrect));
                optionsContainer.appendChild(button);
            });
        }

        function handleAnswer(selectedButton, isCorrect) {
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.add('disabled'));

            if (isCorrect) {
                selectedButton.classList.add('correct');
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 5000);
            } else {
                selectedButton.classList.add('incorrect');
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1200);
            }
        }

        function showScore() {
            quizContainer.innerHTML = `
                <div class="score-screen">
                    <h2 style="margin-bottom:20px;">✅ Test yakunlandi!</h2>
                    <button class="restart-btn" onclick="restartQuiz()">🔄 Qayta boshlash</button>
                </div>
            `;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            quizContainer.innerHTML = `
                <div class="progress-bar" id="progress"></div>
                <div class="question-text" id="question"></div>
                <div class="options-container" id="options"></div>
            `;
            progressEl = document.getElementById('progress');
            questionEl = document.getElementById('question');
            optionsContainer = document.getElementById('options');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
