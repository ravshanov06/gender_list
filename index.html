<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analitik Geometriya · 50 savol</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0e12;
            color: #f0f2f6;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .quiz-container {
            background: #161822;
            border: 1px solid #26293b;
            border-radius: 18px;
            padding: 28px 32px;
            width: 100%;
            max-width: 820px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.5);
            max-height: 98vh;
            overflow-y: auto;
        }
        .quiz-container::-webkit-scrollbar { width: 4px; }
        .quiz-container::-webkit-scrollbar-track { background: #161822; }
        .quiz-container::-webkit-scrollbar-thumb { background: #2e334c; border-radius: 10px; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .progress-bar {
            font-size: 0.78rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .score-display { color: #10b981; font-weight: 600; }
        .section-badge {
            display: inline-block;
            background: #1f2a3f;
            padding: 3px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #8db0e0;
            letter-spacing: 0.4px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 22px;
            color: #f3f5f9;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .option-btn {
            background: transparent;
            border: 1px solid #2e334c;
            color: #e8ecf5;
            padding: 12px 16px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.92rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            width: 100%;
            line-height: 1.5;
        }
        .option-btn:hover:not(:disabled) {
            background: #1f2235;
            border-color: #6a7fa0;
        }
        .option-btn.correct {
            background: rgba(16,185,129,0.16) !important;
            border-color: #10b981 !important;
            color: #34d399;
            font-weight: 500;
        }
        .option-btn.incorrect {
            background: rgba(239,68,68,0.16) !important;
            border-color: #ef4444 !important;
            color: #f87171;
        }
        .option-btn.show-correct {
            background: rgba(16,185,129,0.16) !important;
            border-color: #10b981 !important;
            color: #34d399;
            font-weight: 500;
        }
        .option-btn.disabled { pointer-events: none; opacity: 0.8; }
        .option-btn.correct.disabled { opacity: 1; }
        .option-btn.show-correct.disabled { opacity: 1; }
        .next-btn-container {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
        }
        .next-btn {
            background: #f0f2f6;
            color: #0d0e12;
            border: none;
            padding: 10px 30px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.92rem;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s, transform 0.1s;
        }
        .next-btn:hover { opacity: 0.85; transform: scale(1.02); }
        .next-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .score-screen { text-align: center; padding: 30px 0; }
        .score-screen h2 { font-size: 2.2rem; margin-bottom: 8px; }
        .final-score { font-size: 1.2rem; color: #9ca3af; margin-bottom: 30px; }
        .final-score span { color: #10b981; font-weight: 700; font-size: 1.8rem; }
        .restart-btn {
            background: #f0f2f6;
            color: #0d0e12;
            border: none;
            padding: 14px 40px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s;
        }
        .restart-btn:hover { opacity: 0.85; }
        @media (max-width: 600px) {
            .quiz-container { padding: 16px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { font-size: 0.85rem; padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <div class="quiz-container" id="quiz">
        <div class="top-bar">
            <div class="progress-bar" id="progress">Savol 1 / 50</div>
            <div class="progress-bar score-display" id="scoreDisplay">✅ 0</div>
        </div>
        <div class="section-badge" id="sectionBadge">Analitik Geometriya</div>
        <div class="question-text" id="question"></div>
        <div class="options-container" id="options"></div>
        <div class="next-btn-container">
            <button class="next-btn" id="nextBtn" disabled>Keyingi →</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  ANALITIK GEOMETRIYA - 50 REAL QUESTIONS
        //  correct = index of correct answer (0,1,2,3)
        // ================================================================
        const QUIZ_DATA = [
            { q: "Vektorlar kollinearlik sharti?", opts: ["aₓ/bₓ = aᵧ/bᵧ = a_z/b_z", "(aₓ+aᵧ+a_z)/(bₓ+bᵧ+b_z) = 1", "aₓbₓ + aᵧbᵧ + a_zb_z = 1", "aₓ/bₓ + aᵧ/bᵧ = a_z/b_z"], correct: 0 },
            { q: "Bazis vektorlar bo'yicha qurilgan tetraedr hajmi?", opts: ["V = 1/6", "V = 1", "V = -1", "V = 1/2"], correct: 0 },
            { q: "a{3,4}, b{1,1} berilgan. π_b a ni toping.", opts: ["7√2/2", "√2/2", "√7", "7/2"], correct: 0 },
            { q: "x = 2a + 3b - c vektorni toping (a{2,4,0}, b{-3,1,1}, c{5,-2,-1})", opts: ["x{-10,13,4}", "x{0,10,4}", "x{10,10,1}", "x{4,8,5}"], correct: 0 },
            { q: "x - y = 0 va x + y = 0 kesishuvchi to'g'ri chiziqlar bissektrisalari?", opts: ["x = y = 0", "x = y = -1", "x = y = 1", "x = 0, y = 1"], correct: 0 },
            { q: "Tekisliklar perpendikulyarlik sharti?", opts: ["AA₁ + BB₁ + CC₁ = 0", "A/A₁ = B/B₁ = C/C₁ = 0", "(A+B+C)(A₁+B₁+C₁)=0", "A/A₁+B/B₁+C/C₁=0"], correct: 0 },
            { q: "y = 5x - 6 va y = 5x + 4 to'g'ri chiziqlar burchagi?", opts: ["α = 0°", "α = 30°", "α = 45°", "α = 60°"], correct: 0 },
            { q: "y = k₁x + b₁ va y = k₂x + b₂ kesishish burchagi tangensi?", opts: ["tgα = (k₂ - k₁)/(1 + k₁k₂)", "tgα = 1 + (k₁+k₂)/(1-k₁k₂)", "tgα = 1 + (k₁-k₂)/(1-k₁k₂)", "tgα = 1 + (k₁+k₂)/(1+k₁k₂)"], correct: 0 },
            { q: "AB kesma o'rtasi radius-vektori?", opts: ["(r_A + r_B)/2", "(r_B - r_A)/2", "r_A + r_B", "r_A - r_B"], correct: 0 },
            { q: "[(2i - 3j + k)(i - 2j - k)] vektor moduli?", opts: ["√35", "-7", "7", "35"], correct: 0 },
            { q: "a{3,4} ga yo'nalishdosh b{9,12} moduli necha marta katta?", opts: ["3", "2", "4", "5"], correct: 0 },
            { q: "a{4,6}, b{-3,3}, c{4,1} vektorlarni ifodalang:", opts: ["c = ½a - ⅔b", "c = 4a + 4b", "c = a - ⅓b", "c = ¼a - 4/3 b"], correct: 0 },
            { q: "d₁{2,0} va d₂{1,-1} vektorlar orasidagi burchak?", opts: ["45°", "60°", "90°", "120°"], correct: 0 },
            { q: "a{1,7} va b{4,3} vektorlar burchagi?", opts: ["α = π/4", "α = 60°", "π/6", "α = 75°"], correct: 0 },
            { q: "Vektor ko'paytmasi to'g'ri?", opts: ["[ab] = { |bᵧ aᵧ|; |b_z a_z|; |bₓ aₓ| }", "[ab] = { bₓ/aₓ; bᵧ/aᵧ; b_z/a_z +1 }", "[ab] = {bₓ/aₓ; bᵧ/aᵧ; b_z/a_z}", "[ab] = {aₓ+bₓ; aᵧ+bᵧ; a_z+b_z}"], correct: 0 },
            { q: "P{5, -√2, 3} vektor bilan k vektor burchagi?", opts: ["Cos = 1/2", "Cos = √3/2", "Cos = π/2", "Cos = -√2/6"], correct: 0 },
            { q: "|MN| vektorning a o'qdagi proyeksiyasi?", opts: ["|MN|·Cosα", "|MN|·tgα", "|MN|·Ctgα", "|MN|·Sinα"], correct: 0 },
            { q: "Vektorlar kollinearlik sharti?", opts: ["aₓ/bₓ = aᵧ/bᵧ = a_z/b_z", "aₓ/bₓ + aᵧ/bᵧ + a_z/b_z = 1", "aₓbₓ + aᵧbᵧ + a_zb_z = 0", "(aₓ+aᵧ+a_z)/(bₓ+bᵧ+b_z) = λ"], correct: 0 },
            { q: "a ning qanday qiymatida a{2,a} va b{a,2} qarama-qarshi?", opts: ["a = -2", "a = -1", "a = 1", "a = 2"], correct: 0 },
            { q: "x + y = 0 qanday chiziq?", opts: ["To'g'ri chiziq", "Parabola", "Giperbola", "Ellips"], correct: 0 },
            { q: "α ning qanday qiymatlarida a{α,1,0} va b{α,2,-3} vektorlar o'zaro perpendikulyar?", opts: ["α = 2", "α = -2", "α = 1", "α = -1"], correct: 0 },
            { q: "M₀(x₀,y₀) nuqtadan Ax+By+C=0 to'g'ri chiziqgacha masofa?", opts: ["d = |Ax₀+By₀+C|/√(A²+B²)", "d = |A(x-x₀)+B(y-y₀)|", "d = √(Ax₀+By₀+C)", "d = |Ax₀+By₀+C|"], correct: 0 },
            { q: "O(0;0) nuqtadan ax+by+d=0 tekislikgacha masofa?", opts: ["|d|/√(a²+b²)", "a²+b²+d²", "d/(a+b)", "|a+b|/d"], correct: 0 },
            { q: "Ax+By+Cz+D=0 tekislik normal vektori?", opts: ["n{A,B,C}", "n{A,B,0}", "n{-B,A,C}", "n{A/C,B/C,1}"], correct: 0 },
            { q: "Ax+By+Cz+D=0 tekislikning (Oxy) tekislikka perpendikulyarlik sharti?", opts: ["C = 0", "ABC = 0", "A+B = 1", "A+B+C = 0"], correct: 0 },
            { q: "By+Cz+D=0 tekislikning vaziyati?", opts: ["Ox o'qqa parallel", "Ox o'qdan o'tadi", "Yoz tekislikka parallel", "Yoz tekislikka perpendikulyar"], correct: 0 },
            { q: "Ax+By+Cz+D=0 tekislikning normal vektori?", opts: ["N{A,B,C}", "n{B,C,D}", "n{A,B,O}", "n{A,B,D}"], correct: 0 },
            { q: "3x - 5y - 30 = 0 to'g'ri chiziq koordinat o'qlari bilan kesishib ajratgan uchburchak yuzi?", opts: ["30 kv.bir", "60 kv.bir", "15 kv.bir", "10 kv.bir"], correct: 0 },
            { q: "3x + 2y - 6 = 0 to'g'ri chiziqqa nisbatan M(5;2) nuqtaga simmetrik nuqta?", opts: ["N(-1;-2)", "N(1;2)", "N(2;1)", "N(1;1)"], correct: 0 },
            { q: "(x-x₀)/a = (y-y₀)/b = (z-z₀)/c to'g'ri chiziqning yo'naltiruvchi vektori?", opts: ["P{a,b,c}", "P{ax₀,by₀,cz₀}", "P{x₀,y₀,z₀}", "P{x₀/a,y₀/b,z₀/c}"], correct: 0 },
            { q: "OZ o'q va M(-1,6,3) nuqta orqali o'tuvchi tekislik?", opts: ["6x + y = 0", "x + 6y = 0", "x + 6z = 0", "6x + z = 0"], correct: 0 },
            { q: "oy o'q va M(3,4,-5) nuqtadan o'tuvchi tekislik?", opts: ["5x + 3z = 0", "3x + 5z = 0", "3y + 5z = 0", "5y + 3z = 0"], correct: 0 },
            { q: "OZ o'q orqali o'tuvchi tekislik?", opts: ["Ax + By = 0", "Ax + By + D = 0", "Ax + Cz + D = 0", "Ax + Cz = 0"], correct: 0 },
            { q: "x² - 2xy + y² - 6x - 2y + 9 = 0 chiziqning invariantlari?", opts: ["I₁=2, I₂=0, I₃=-16", "I₁=0, I₂=2, I₃=16", "I₁=0, I₂=0, I₃=-16", "I₁=2, I₂=2, I₃=16"], correct: 0 },
            { q: "M(2,-3,1) nuqtadan o'tib n{1,-2,4} vektorga perpendikulyar tekislik?", opts: ["x - 2y + 4z - 12 = 0", "x - 2y + 4z + 12 = 0", "x - 2y + 4z = 0", "x - 2y + 4z + 10 = 0"], correct: 0 },
            { q: "P(2,4) nuqtadan 3x - 4y + 5 = 0 to'g'ri chiziqqacha masofa?", opts: ["d = 1", "d = 4", "d = 5", "d = 3"], correct: 0 },
            { q: "x = at + b, y = ct + d (−∞ < t < ∞) nimani ifoda etadi?", opts: ["To'g'ri chiziqni", "Nurni", "Kesmani", "Aylanani"], correct: 0 },
            { q: "a{2,-1,3}, b{1,3,n} vektorlar perpendikulyar bo'lishi uchun n?", opts: ["n = 1/3", "n = 2", "n = 1", "n = 3"], correct: 0 },
            { q: "a{4,3}, b{1,7} vektorlar burchagi?", opts: ["α = 45°", "α = 60°", "α = 30°", "α = 90°"], correct: 0 },
            { q: "Π₁ va Π₂ tekisliklarning parallel bo'lish sharti?", opts: ["A₁/A₂ = B₁/B₂ = C₁/C₂ ≠ D₁/D₂", "A₁/A₂ = B₁/B₂ = C₁/C₂ = D₁/D₂", "A₁/A₂ + B₁/B₂ + C₁/C₂ = 1", "A₁A₂ + B₁B₂ + C₁C₂ = 0"], correct: 0 },
            { q: "Π₁ va Π₂ tekisliklarning perpendikulyarlik sharti?", opts: ["A₁A₂ + B₁B₂ + C₁C₂ = 0", "A₁/A₂ = B₁/B₂ = C₁/C₂", "A₁B₁C₁ = A₂B₂C₂", "A₁+B₁+C₁ = A₂+B₂+C₂"], correct: 0 },
            { q: "Ax+By+C=0, Ax+By-C=0 to'g'ri chiziqlar vaziyati?", opts: ["Koordinatalar boshiga nisbatan simmetrik", "Ox o'qqa nisbatan simmetrik", "Oy o'qqa nisbatan simmetrik", "Kesishadi"], correct: 0 },
            { q: "A₁x+B₁y+C₁=0, A₂x+B₂y+C₂=0 kesishish sharti?", opts: ["|A₁ B₁; A₂ B₂| ≠ 0", "|B₁ C₁; B₂ C₂| = 0", "|A₁ B₁; A₂ B₂| = 0", "|A₁ C₁; A₂ C₂| = 0"], correct: 0 },
            { q: "y=k₁x+b₁, y=k₂x+b₂ parallel sharti?", opts: ["k₁ = k₂", "k₁k₂ = 1", "k₁k₂ = -1", "k₁ + k₂ = 0"], correct: 0 },
            { q: "A₁x+B₁y+C₁=0, A₂x+B₂y+C₂=0 perpendikulyar sharti?", opts: ["A₁A₂ + B₁B₂ = 0", "A₁/A₂ = B₁/B₂", "A₁B₁ + A₂B₂ = 0", "A₁A₂ + C₁C₂ = 0"], correct: 0 },
            { q: "y=k₁x+b₁, y=k₂x+b₂ perpendikulyarlik sharti?", opts: ["k₁k₂ = -1", "k₁k₂ = 1", "k₁k₂ = 1", "k₁ + k₂ = 0"], correct: 0 },
            { q: "Giperbolaning fokuslari koordinatalari?", opts: ["F₁(-c,0), F₂(c,0)", "F₁(0,-c), F₂(0,c)", "F₁(-a,0), F₂(a,0)", "F₁(0,-a), F₂(0,a)"], correct: 0 },
            { q: "a(1,0) va b(1,-1) vektorlar orasidagi burchak?", opts: ["45°", "60°", "90°", "135°"], correct: 0 },
            { q: "a va b vektorlar tashkil etgan burchak?", opts: ["π/4", "π/3", "π/6", "π/2"], correct: 0 },
            { q: "Aylananing radiusi: (x-1)²+(y-2)²=1", opts: ["1", "2", "3", "5"], correct: 0 }
        ];

        // ================================================================
        //  APP LOGIC
        // ================================================================
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let questions = shuffle([...QUIZ_DATA]);
        let current = 0;
        let correct = 0;
        let answered = false;

        const quizEl = document.getElementById('quiz');
        const progressEl = document.getElementById('progress');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const sectionBadge = document.getElementById('sectionBadge');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const nextBtn = document.getElementById('nextBtn');

        function render() {
            if (current >= questions.length) {
                showScore();
                return;
            }
            const q = questions[current];
            progressEl.textContent = `Savol ${current+1} / ${questions.length}`;
            scoreDisplay.textContent = `✅ ${correct}`;
            sectionBadge.textContent = "Analitik Geometriya";
            questionEl.textContent = q.q;

            optionsEl.innerHTML = '';
            const opts = q.opts.map((t, i) => ({ text: t, isCorrect: i === q.correct }));
            shuffle(opts);

            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                btn.dataset.correct = opt.isCorrect;
                btn.addEventListener('click', () => handleClick(btn, opt.isCorrect));
                optionsEl.appendChild(btn);
            });

            nextBtn.disabled = true;
            answered = false;
            nextBtn.textContent = current === questions.length - 1 ? '🏁 Yakunlash' : 'Keyingi →';
        }

        function handleClick(btn, isCorrect) {
            if (answered) return;
            answered = true;
            const all = optionsEl.querySelectorAll('.option-btn');
            all.forEach(b => b.classList.add('disabled'));
            all.forEach(b => {
                if (b.dataset.correct === 'true') b.classList.add('show-correct');
            });
            if (isCorrect) {
                btn.classList.add('correct');
                correct++;
            } else {
                btn.classList.add('incorrect');
            }
            nextBtn.disabled = false;
        }

        function nextQuestion() {
            if (!answered) return;
            current++;
            render();
        }

        function showScore() {
            const pct = Math.round((correct / questions.length) * 100);
            const emoji = pct >= 80 ? '🌟' : pct >= 60 ? '💪' : pct >= 40 ? '📚' : '😢';
            quizEl.innerHTML = `
                <div class="score-screen">
                    <h2>${emoji} Test yakunlandi!</h2>
                    <div class="final-score">
                        To‘g‘ri javoblar: <span>${correct}</span> / ${questions.length}
                        <br><span style="font-size:1rem;color:#9ca3af;">(${pct}%)</span>
                    </div>
                    <button class="restart-btn" onclick="location.reload()">🔄 Qayta boshlash</button>
                </div>
            `;
        }

        nextBtn.addEventListener('click', nextQuestion);
        render();
    </script>
</body>
</html>
